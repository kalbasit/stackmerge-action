name: Stackmerge — Start
description: |
  Triggered when a label is applied to the top-most PR of a stack.
  Propagates the label down the base chain and enables GitHub's
  squash-auto-merge on the bottom PR (the one whose base is the trunk).

  Pair with `kalbasit/stackmerge-action/continue` in a separate workflow
  that fires on `pull_request: closed`.

inputs:
  token:
    description: |
      GitHub token used to propagate the label and enable auto-merge.
      A Personal Access Token with `repo` scope is required — the
      built-in `GITHUB_TOKEN` cannot enable auto-merge on PRs it did
      not author.
    required: true
  label:
    description: "Label that triggers stack merging."
    required: false
    default: merge-stack
  trunk:
    description: "Trunk branch name."
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Write gh_retry helper
      shell: bash
      run: |
        cat > /tmp/gh_retry.sh << 'HELPER'
        gh_retry() {
          local _rc _errfile _err reset_ts reset_human
          _errfile=$(mktemp)
          trap 'rm -f "$_errfile"' RETURN
          gh "$@" 2>"$_errfile"
          _rc=$?
          if (( _rc == 0 )); then
            return 0
          fi
          _err=$(<"$_errfile")
          if [[ "$_err" == *"rate limit"* || "$_err" == *"API rate limit"* ]]; then
            reset_ts=$(gh api rate_limit \
              --jq '[.resources.core.reset, .resources.graphql.reset] | max' \
              2>/dev/null || echo 0)
            if (( reset_ts > 0 )); then
              reset_human=$(date -u -d "@$reset_ts" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
                         || date -u -r "$reset_ts" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
                         || printf '%s' "$reset_ts")
            else
              reset_human="unknown (gh api rate_limit also failed)"
            fi
            printf '%s\n' "$_err" >&2
            printf '::error::GitHub API rate limit exhausted. Reset at %s — re-run after that time.\n' \
              "$reset_human" >&2
            return "$_rc"
          fi
          printf '%s\n' "$_err" >&2
          return "$_rc"
        }
        HELPER

    - name: Walk base chain and label each PR down to trunk
      id: walk
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        LABEL: ${{ inputs.label }}
        TRUNK: ${{ inputs.trunk }}
      run: |
        set -euo pipefail
        source /tmp/gh_retry.sh
        pr="${{ github.event.pull_request.number }}"
        while :; do
          base="$(gh_retry pr view "$pr" --repo "$REPO" --json baseRefName -q .baseRefName)"
          if [[ "$base" == "$TRUNK" ]]; then
            echo "bottom=$pr" >> "$GITHUB_OUTPUT"
            break
          fi
          next="$(gh_retry pr list --repo "$REPO" --state open --head "$base" \
            --json number -q '.[0].number')"
          if [[ -z "$next" ]]; then
            # Race: GitHub retargets a PR's base to trunk only after its
            # parent branch is deleted post-merge. If continue fires
            # start before retargeting completes, we'll find no open PR
            # for the base — but the current PR is already the bottom.
            merged="$(gh_retry pr list --repo "$REPO" --state merged --head "$base" \
              --json number -q '.[0].number')"
            if [[ -n "$merged" ]]; then
              echo "bottom=$pr" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "::error::Could not find an open PR for branch '$base'; stack is broken."
            exit 1
          fi
          gh_retry pr edit "$next" --repo "$REPO" --add-label "$LABEL"
          pr="$next"
        done

    - name: Enable auto-merge on bottom PR
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        BOTTOM: ${{ steps.walk.outputs.bottom }}
      run: |
        set -euo pipefail
        source /tmp/gh_retry.sh
        # Idempotent: treat both "Merge already in progress" (auto-merge
        # queued but PR not yet merged) and "Pull request is already merged"
        # (race: PR merged before this step ran) as success.
        if ! out=$(gh_retry pr merge "$BOTTOM" --repo "$REPO" --squash --auto 2>&1); then
          if [[ "$out" == *"Merge already in progress"* ]]; then
            echo "Auto-merge already enabled on PR #$BOTTOM."
          elif [[ "$out" == *"Pull request is already merged"* ]]; then
            echo "PR #$BOTTOM is already merged; nothing to do."
          else
            echo "$out" >&2
            exit 1
          fi
        fi
